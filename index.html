<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
<form action="index.html" method="get">
    <fieldset>
    <legend>Datos personales by TuNombre</legend>

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required autofocus size="30" maxlength="40">

    <br><br>

    <label for="contrasena">Contraseña:</label>
    <input type="password" id="contrasena" name="contrasena" minlength="8">

    <br><br>

    <label for="correo">Correo electrónico:</label>
    <input type="email" id="correo" name="correo" required>

    <br><br>

    <label for="telefono">Teléfono:</label>
    <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}">
    <br><br>

<label for="fecha">Fecha de nacimiento:</label>
<input type="date" id="fecha" name="fecha">

<br><br>

<label for="foto">Foto:</label>
<input type="file" id="foto" name="foto">

<br><br>

<label for="curso">Curso:</label>
<input type="text" id="curso" name="curso" value="2026-27" readonly>

<br><br>

<label for="centro">Centro:</label>
<input type="text" id="centro" name="centro" value="IES La Asunción" disabled>
</fieldset>
    <fieldset>
    <legend>Preferencias</legend>

    <p>Turno:</p>

    <input type="radio" id="manana" name="turno" value="manana">
    <label for="manana">Mañana</label>

    <input type="radio" id="tarde" name="turno" value="tarde">
    <label for="tarde">Tarde</label>

    <br><br>

    <p>Intereses:</p>

    <input type="checkbox" id="redes" name="intereses" value="redes">
    <label for="redes">Redes</label>

    <input type="checkbox" id="programacion" name="intereses" value="programacion">
    <label for="programacion">Programación</label>

    <input type="checkbox" id="sistemas" name="intereses" value="sistemas">
    <label for="sistemas">Sistemas</label>
    <fieldset>
    <legend>Preferencias</legend>

    <p>Turno:</p>

    <input type="radio" id="manana" name="turno" value="manana">
    <label for="manana">Mañana</label>

    <input type="radio" id="tarde" name="turno" value="tarde">
    <label for="tarde">Tarde</label>

    <br><br>

    <p>Intereses:</p>

    <input type="checkbox" id="redes" name="intereses" value="redes">
    <label for="redes">Redes</label>

    <input type="checkbox" id="programacion" name="intereses" value="programacion">
    <label for="programacion">Programación</label>

    <input type="checkbox" id="sistemas" name="intereses" value="sistemas">
    <label for="sistemas">Sistemas</label>
</fieldset>
</fieldset>

</form>
</body>
</html>
