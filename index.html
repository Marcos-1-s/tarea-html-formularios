<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
<form action="index.html" method="get">
    <fieldset>
    <legend>Datos personales by TuNombre</legend>

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required autofocus size="30" maxlength="40">

    <br><br>

    <label for="contrasena">Contraseña:</label>
    <input type="password" id="contrasena" name="contrasena" minlength="8">

    <br><br>

    <label for="correo">Correo electrónico:</label>
    <input type="email" id="correo" name="correo" required>

    <br><br>

    <label for="telefono">Teléfono:</label>
    <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}">
    <br><br>

<label for="fecha">Fecha de nacimiento:</label>
<input type="date" id="fecha" name="fecha">

<br><br>

<label for="foto">Foto:</label>
<input type="file" id="foto" name="foto">

<br><br>

<label for="curso">Curso:</label>
<input type="text" id="curso" name="curso" value="2026-27" readonly>

<br><br>

<label for="centro">Centro:</label>
<input type="text" id="centro" name="centro" value="IES La Asunción" disabled>
</fieldset>
    <fieldset>
    <legend>Preferencias</legend>

    <p>Turno:</p>

    <input type="radio" id="manana" name="turno" value="manana">
    <label for="manana">Mañana</label>

    <input type="radio" id="tarde" name="turno" value="tarde">
    <label for="tarde">Tarde</label>

    <br><br>

    <p>Intereses:</p>

    <input type="checkbox" id="redes" name="intereses" value="redes">
    <label for="redes">Redes</label>

    <input type="checkbox" id="programacion" name="intereses" value="programacion">
    <label for="programacion">Programación</label>

    <input type="checkbox" id="sistemas" name="intereses" value="sistemas">
    <label for="sistemas">Sistemas</label>
    <fieldset>
    <legend>Preferencias</legend>

    <p>Turno:</p>

    <input type="radio" id="manana" name="turno" value="manana">
    <label for="manana">Mañana</label>

    <input type="radio" id="tarde" name="turno" value="tarde">
    <label for="tarde">Tarde</label>

    <br><br>

    <p>Intereses:</p>

    <input type="checkbox" id="redes" name="intereses" value="redes">
    <label for="redes">Redes</label>

    <input type="checkbox" id="programacion" name="intereses" value="programacion">
    <label for="programacion">Programación</label>

    <input type="checkbox" id="sistemas" name="intereses" value="sistemas">
    <label for="sistemas">Sistemas</label>
</fieldset>
<br><br>

<label for="horas">Horas de estudio:</label>
<input type="number" id="horas" name="horas" min="0" max="10" step="2">

<br><br>

<label for="nivel">Nivel:</label>
<input type="range" id="nivel" name="nivel" min="1" max="10">

<br><br>

<label for="color">Color favorito:</label>
<input type="color" id="color" name="color">

<br><br>

<label for="hora">Hora:</label>
<input type="time" id="hora" name="hora">

<br><br>

<label for="semana">Semana:</label>
<input type="week" id="semana" name="semana">

<br><br>

<label for="mes">Mes:</label>
<input type="month" id="mes" name="mes">
<br><br>

<label for="modulos">Módulos:</label>
<select id="modulos" name="modulos" multiple>
    <optgroup label="Sistemas">
        <option value="sistemas-operativos" selected>Sistemas operativos</option>
        <option value="servicios-en-red">Servicios en red</option>
    </optgroup>
    <optgroup label="Redes">
        <option value="redes-locales">Redes locales</option>
        <option value="seguridad-informatica">Seguridad informática</option>
    </optgroup>
</select>

<br><br>

<label for="comentarios">Comentarios:</label>
<textarea id="comentarios" name="comentarios" rows="5" cols="40"></textarea>
</fieldset>
<br><br>

<input type="submit" value="Enviar formulario">

<input type="reset" value="Restablecer">

<input type="button" value="Botón normal" onclick="alert('Has pulsado el botón')">

<br><br>

<input type="image" src="boton.png" alt="Enviar formulario con imagen" width="100" height="40">

<br><br>

<button type="submit">Enviar con button</button>

<button type="reset">Restablecer con button</button>

<button type="button" onclick="alert('Has pulsado el botón')">Botón normal con button</button>
</form>
<h2>Buscar en Wikipedia</h2>

<form action="https://es.wikipedia.org/w/index.php" method="get">
    <label for="search">Buscar artículo:</label>

    <input type="search" id="search" name="search" list="sugerencias" placeholder="Escribe lo que quieres buscar">

    <datalist id="sugerencias">
        <option value="Formulario web">
        <option value="HTML">
        <option value="Protocolo de transferencia de hipertexto">
    </datalist>

    <button type="submit">Buscar en Wikipedia</button>
</form>
<h2>Buscar una ciudad en el mapa</h2>

<form action="https://www.openstreetmap.org/search" method="get">
    <label for="query">Elige una ciudad:</label>

    <select id="query" name="query">
        <optgroup label="Alicante">
            <option value="Alicante">Alicante</option>
            <option value="Elche">Elche</option>
        </optgroup>

        <optgroup label="Valencia">
            <option value="Valencia">Valencia</option>
            <option value="Gandia">Gandia</option>
        </optgroup>
    </select>

    <button type="submit">Buscar en el mapa</button>
</form>
<h2>Validar HTML</h2>

<form action="https://validator.w3.org/nu/" method="get">
    <label for="doc">URL de la página:</label>
    <input type="url" id="doc" name="doc" value="https://Marcos-1-s.github.io/tarea-html-formularios/" required>

    <br><br>

    <input type="checkbox" id="showsource" name="showsource" value="yes">
    <label for="showsource">Ver el código</label>

    <br><br>

    <button type="submit">Validar HTML</button>
</form>
</body>
</html>
